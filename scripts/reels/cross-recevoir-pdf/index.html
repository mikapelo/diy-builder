<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px;
        overflow: hidden;
        background: #0a0b0c;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      .bg-layer {
        position: absolute; inset: -3%;
        width: 106%; height: 106%;
        object-fit: cover;
        object-position: center 35%;
        filter: brightness(0.92) saturate(1.0);
        will-change: transform, opacity;
        opacity: 0;
      }
      #bg-overlay {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 95% 65% at 50% 40%,
            transparent 0%, transparent 28%,
            rgba(0,0,0,0.35) 60%, rgba(0,0,0,0.78) 90%, #0a0b0c 100%),
          linear-gradient(180deg,
            transparent 0%, transparent 72%,
            rgba(0,0,0,0.45) 88%, #0a0b0c 100%);
      }
      .scene {
        position: absolute; inset: 0;
        opacity: 0; z-index: 10;
        will-change: transform, opacity;
        display: flex; flex-direction: column; justify-content: center;
      }

      /* S1 — Hook accroche éditoriale */
      #s1 { align-items: center; padding: 0 60px; text-align: center; }
      #badge {
        display: inline-flex; align-items: center; gap: 12px;
        background: rgba(10,10,12,0.62);
        border: 1.5px solid rgba(201,151,30,0.85);
        color: #E8C56A;
        font-size: 26px; font-weight: 700;
        letter-spacing: 4px; text-transform: uppercase;
        padding: 11px 32px; border-radius: 60px;
        margin-bottom: 44px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.55);
        text-shadow: 0 1px 2px rgba(0,0,0,0.95);
      }
      #hook-title {
        font-size: 144px; font-weight: 900;
        color: #fff;
        line-height: 1.0; letter-spacing: -5px;
        text-shadow:
          0 2px 8px rgba(0,0,0,0.85),
          0 6px 20px rgba(0,0,0,0.65);
      }
      #hook-em {
        font-size: 144px; font-weight: 900;
        color: #C9971E;
        font-style: italic;
        line-height: 1.0; letter-spacing: -5px;
        text-shadow:
          0 0 80px rgba(201,151,30,0.55),
          0 0 30px rgba(201,151,30,0.30),
          0 4px 14px rgba(0,0,0,0.85);
      }
      #hook-sub2 {
        font-size: 56px; font-weight: 800; color: #fff;
        margin-top: 24px; letter-spacing: -1px;
        text-shadow:
          0 1px 2px rgba(0,0,0,0.95),
          0 3px 8px rgba(0,0,0,0.85),
          0 6px 18px rgba(0,0,0,0.65);
      }

      /* S2 — Setup descriptif */
      #s2 { padding: 0 72px; text-align: left; }
      .wbw-line {
        display: block; line-height: 1.06;
        margin-bottom: 14px; overflow: hidden;
      }
      .w-wrap { display: inline-block; overflow: hidden; vertical-align: bottom; }
      .w {
        display: inline-block;
        font-size: 88px; font-weight: 900;
        color: #fff; letter-spacing: -2px;
      }
      .w.gold { color: #C9971E; }

      /* S3 — Stats banner (3 chiffres clés) */
      #s3 { align-items: center; padding: 0 50px; text-align: center; }
      #s3-title {
        font-size: 38px; font-weight: 700;
        color: rgba(255,255,255,0.85);
        letter-spacing: 4px; text-transform: uppercase;
        margin-bottom: 60px;
        background: rgba(0,0,0,0.55);
        padding: 14px 28px; border-radius: 12px;
      }
      .stat-grid {
        display: flex; gap: 22px;
        justify-content: center; align-items: stretch;
        width: 100%;
      }
      .stat-card {
        flex: 1;
        background: rgba(10,10,12,0.72);
        border: 1.5px solid rgba(201,151,30,0.55);
        border-radius: 22px;
        padding: 32px 16px;
        opacity: 0;
        transform: translateY(40px) scale(0.92);
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      }
      .stat-num {
        font-size: 88px; font-weight: 900;
        color: #C9971E; line-height: 1;
        text-shadow: 0 0 40px rgba(201,151,30,0.45);
      }
      .stat-num-sm {
        font-size: 64px;
      }
      .stat-label {
        font-size: 22px; font-weight: 700;
        color: rgba(255,255,255,0.65);
        letter-spacing: 2px; text-transform: uppercase;
        margin-top: 14px;
      }
      .stat-tool {
        font-size: 22px; font-weight: 600;
        color: rgba(255,255,255,0.70);
        margin-top: 8px;
        letter-spacing: -0.2px;
      }

      /* S4 CTA */
      #s4 { align-items: center; padding: 0 60px; text-align: center; }
      #cta-eyebrow {
        font-size: 38px; font-weight: 700; color: #fff;
        margin-bottom: 32px;
        text-shadow:
          0 1px 2px rgba(0,0,0,0.95),
          0 2px 6px rgba(0,0,0,0.85),
          0 4px 14px rgba(0,0,0,0.65);
      }
      #cta-pill {
        display: inline-block;
        background: linear-gradient(135deg, #E8C56A, #C9971E);
        color: #0a0b0c;
        font-size: 60px; font-weight: 900;
        padding: 32px 92px;
        border-radius: 100px;
        letter-spacing: -1px;
        box-shadow:
          0 14px 70px rgba(201,151,30,0.60),
          inset 0 2px 0 rgba(255,255,255,0.25);
      }
      #cta-sub {
        font-size: 32px; font-weight: 600;
        color: rgba(255,255,255,0.82);
        margin-top: 28px;
        text-shadow:
          0 1px 2px rgba(0,0,0,0.95),
          0 2px 6px rgba(0,0,0,0.80),
          0 4px 12px rgba(0,0,0,0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="cross-recevoir-pdf"
         data-start="0"
         data-duration="22"
         data-width="1080"
         data-height="1920">

      <img class="bg-layer" id="bg-3d"        src="./bg-3d.png"        alt="" />
      <img class="bg-layer" id="bg-budget"    src="./bg-budget.png"    alt="" />
      <img class="bg-layer" id="bg-materiaux" src="./bg-materiaux.png" alt="" />
      <div id="bg-overlay"></div>

      <div id="s1" class="scene">
        <div id="badge">📬 Ton projet par mail</div>
        <div id="hook-title">Tout ton projet</div>
        <div id="hook-em">par mail.</div>
        <div id="hook-sub2">Gratuit.</div>
      </div>

      <div id="s2" class="scene">
        <span class="wbw-line">
          <span class="w-wrap"><span class="w gold" id="w1">Plans.</span></span>
        </span>
        <span class="wbw-line">
          <span class="w-wrap"><span class="w gold" id="w3">Matériaux.</span></span>
        </span>
        <span class="wbw-line">
          <span class="w-wrap"><span class="w gold" id="w6">Comparatif.</span></span>
        </span>
      </div>

      <div id="s3" class="scene">
        <div id="s3-title">Dans ton dossier</div>
        <div class="stat-grid">
          <div class="stat-card" id="stat-1">
            <div class="stat-num">📐</div>
            <div class="stat-label">PDF</div>
            <div class="stat-tool">4 pages plans + coupes</div>
          </div>
          <div class="stat-card" id="stat-2">
            <div class="stat-num">📦</div>
            <div class="stat-label">Matériaux</div>
            <div class="stat-tool">liste complète détaillée</div>
          </div>
          <div class="stat-card" id="stat-3">
            <div class="stat-num">💰</div>
            <div class="stat-label">Comparatif</div>
            <div class="stat-tool">prix 3 enseignes</div>
          </div>
        </div>
      </div>

      <div id="s4" class="scene">
        <div id="cta-eyebrow">Reçois ton dossier en 30s</div>
        <div id="cta-pill">→ diy-builder.fr</div>
        <div id="cta-sub">Terrasse · Cabanon · Pergola · Clôture</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // BG rotation
      tl.set("#bg-3d", { opacity: 1, scale: 1.02 }, 0);
      tl.to("#bg-3d", { scale: 1.06, duration: 9, ease: "sine.inOut" }, 0);
      tl.to("#bg-3d", { opacity: 0, scale: 1.09, duration: 0.7, ease: "power2.inOut" }, 8.85);

      tl.set("#bg-budget", { opacity: 0, scale: 0.96 }, 0);
      tl.to("#bg-budget", { opacity: 1, scale: 1.0, duration: 0.7, ease: "power2.inOut" }, 8.85);
      tl.to("#bg-budget", { scale: 1.05, duration: 6.5, ease: "sine.inOut" }, 9.55);
      tl.to("#bg-budget", { opacity: 0, scale: 1.08, duration: 0.7, ease: "power2.inOut" }, 15.65);

      tl.set("#bg-materiaux", { opacity: 0, scale: 0.96 }, 0);
      tl.to("#bg-materiaux", { opacity: 1, scale: 1.0, duration: 0.7, ease: "power2.inOut" }, 15.65);
      tl.to("#bg-materiaux", { scale: 1.05, duration: 6, ease: "sine.inOut" }, 16.35);

      function sceneOut(s, t, d=0.45) {
        tl.to(s, { opacity: 0, y: -40, duration: d, ease: "power2.in" }, t);
      }

      // S1 — HOOK éditorial 0–4.5s
      tl.set("#s1", { opacity: 1 }, 0);
      tl.from("#badge", { y: -40, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.from("#hook-title", { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.50);
      tl.from("#hook-em",
        { scale: 0.85, opacity: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.95);
      tl.from("#hook-sub2", { y: 22, opacity: 0, duration: 0.45, ease: "power2.out" }, 1.65);
      sceneOut("#s1", 4.50);

      // S2 — SETUP 5.0–8.7s
      tl.set("#s2", { opacity: 1 }, 5.0);
      tl.from("#w1", { y: "110%", duration: 0.45, ease: "power3.out" }, 5.0);
      tl.from("#w3", { y: "110%", duration: 0.45, ease: "power3.out" }, 5.85);
      tl.from("#w6", { y: "110%", duration: 0.45, ease: "power3.out" }, 6.70);
      sceneOut("#s2", 8.65);

      // S3 — STATS 9.2–15.6s
      tl.set("#s3", { opacity: 1 }, 9.20);
      tl.from("#s3-title", { y: 30, opacity: 0, duration: 0.50, ease: "power3.out" }, 9.20);

      tl.to("#stat-1",
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 10.0);
      tl.to("#stat-2",
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 11.0);
      tl.to("#stat-3",
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 12.0);

      // 3 pulses séquentiels sur les stats pour rythmer
      tl.to("#stat-1", { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 13.30);
      tl.to("#stat-2", { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 13.65);
      tl.to("#stat-3", { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 14.0);

      sceneOut("#s3", 15.55);

      // S4 — CTA 16–22s
      tl.set("#s4", { opacity: 1 }, 16.0);
      tl.from("#cta-eyebrow", { y: 30, opacity: 0, duration: 0.50, ease: "power3.out" }, 16.10);
      tl.from("#cta-pill",
        { scale: 0.78, opacity: 0, duration: 0.65, ease: "back.out(1.8)" }, 16.65);
      tl.from("#cta-sub", { y: 20, opacity: 0, duration: 0.45, ease: "power2.out" }, 17.20);
      tl.to("#cta-pill",
        { scale: 1.05, duration: 0.30, ease: "power1.inOut", yoyo: true, repeat: 1 }, 18.50);
      tl.to("#cta-pill",
        { scale: 1.06, duration: 0.30, ease: "power1.inOut", yoyo: true, repeat: 1 }, 20.50);

      window.__timelines["cross-recevoir-pdf"] = tl;
    </script>
  </body>
</html>
